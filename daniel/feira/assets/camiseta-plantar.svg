<svg xmlns="http://www.w3.org/2000/svg" width="320" height="380" viewBox="0 0 320 380" fill="none" role="img" aria-labelledby="t3">
  <!-- Mockup camiseta PLANTAR  off-white com accent musgo -->
  <title id="t3">Camiseta Plantar</title>
  <defs>
    <linearGradient id="cloth3" x1="160" y1="40" x2="160" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F2E8"/>
      <stop offset="1" stop-color="#E8DFCC"/>
    </linearGradient>
    <linearGradient id="shade3" x1="90" y1="80" x2="240" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#2F4632" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="soft3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1F3224" flood-opacity="0.2"/>
    </filter>
  </defs>

  <ellipse cx="160" cy="352" rx="92" ry="12" fill="#1F3224" fill-opacity="0.1"/>

  <g filter="url(#soft3)">
    <path
