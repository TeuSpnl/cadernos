<svg xmlns="http://www.w3.org/2000/svg" width="320" height="380" viewBox="0 0 320 380" fill="none" role="img" aria-labelledby="t2">
  <!-- Mockup camiseta IR  bege natural / croqui -->
  <title id="t2">Camiseta Ir</title>
  <defs>
    <linearGradient id="cloth2" x1="160" y1="40" x2="160" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EFE6D4"/>
      <stop offset="1" stop-color="#D9C9A8"/>
    </linearGradient>
    <linearGradient id="shade2" x1="90" y1="80" x2="240" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#2F4632" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="soft2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1F3224" flood-opacity="0.22"/>
    </filter>
  </defs>

  <ellipse cx="160" cy="352" rx="92" ry="12" fill="#1F3224" fill-opacity="0.1"/>

  <g filter="url(#soft2)">
    <path
