      fill="url(#shade2)"
    />
    <path d="M132 42c8 16 20 24 28 24s20-8 28-24" stroke="#8A7A5C" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M132 42c8 14 18 20 28 20s20-6 28-20" fill="#C9B896" fill-opacity="0.55"/>
    <path d="M104 100l28-10M216 90l28 10" stroke="#8A7A5C" stroke-opacity="0.3" stroke-width="1.5"/>
  </g>

  <!-- Estampa: bússola / caminho + IR -->
  <g transform="translate(160 168)">
    <circle cx="0" cy="-8" r="36" stroke="#2F4632" stroke-width="2.5" fill="none"/>
    <circle cx="0" cy="-8" r="28" stroke="#2F4632" stroke-opacity="0.35" stroke-width="1.2" fill="none"/>
