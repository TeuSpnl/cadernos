<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" fill="none" role="img" aria-labelledby="logoTitle">
  <!-- Logotipo: árvore sobre livro aberto  Feira Missionária -->
  <title id="logoTitle">Árvore sobre livro aberto</title>
  <defs>
    <linearGradient id="folhaGrad" x1="80" y1="18" x2="80" y2="95" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4A7A48"/>
      <stop offset="1" stop-color="#2F4632"/>
    </linearGradient>
    <linearGradient id="livroGrad" x1="28" y1="100" x2="132" y2="148" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EFE6D4"/>
      <stop offset="1" stop-color="#D9C9A8"/>
    </linearGradient>
  </defs>

  <!-- Aura suave atrás da marca -->
  <circle cx="80" cy="72" r="58" fill="#2F4632" fill-opacity="0.06"/>

  <!-- Copa da árvore (folhagem em camadas) -->
  <ellipse cx="80" cy="52" rx="38" ry="34" fill="url(#folhaGrad)"/>
  <ellipse cx="58" cy="62" rx="24" ry="22" fill="#3F5C42"/>
  <ellipse cx="102" cy="62" rx="24" ry="22" fill="#3F5C42"/>
  <ellipse cx="80" cy="40" rx="22" ry="18" fill="#6B9A5C"/>

  <!-- Tronco -->
  <path d="M74 70c2 14 2 22 0 36h12c-2-14-2-22 0-36H74z" fill="#2A3D2E"/>
  <path d="M80 72c-6 6-14 10-22 12 10-2 18-6 22-12 4 6 12 10 22 12-8-2-16-6-22-12z" fill="#3F5C42" fill-opacity="0.55"/>

  <!-- Livro aberto (base) -->
  <path d="M28 108c18-10 36-10 52-2v36c-16-8-34-8-52 2V108z" fill="url(#livroGrad)" stroke="#2F4632" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M132 108c-18-10-36-10-52-2v36c16-8 34-8 52 2V108z" fill="url(#livroGrad)" stroke="#2F4632" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Lombada / vinco central -->
  <path d="M80 106v36" stroke="#2F4632" stroke-width="2" stroke-linecap="round"/>
  <!-- Linhas sugerindo páginas -->
  <path d="M40 118h28M38 126h30M40 134h26" stroke="#2F4632" stroke-opacity="0.28" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M92 118h28M92 126h30M94 134h26" stroke="#2F4632" stroke-opacity="0.28" stroke-width="1.4" stroke-linecap="round"/>
</svg>
