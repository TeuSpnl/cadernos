<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" preserveAspectRatio="none">
  <!-- Textura de papel envelhecido: grão fino + manchas suaves -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.18
                                           0 0 0 0 0.22
                                           0 0 0 0 0.16
                                           0 0 0 0.07 0" in="noise" result="grain"/>
    </filter>
    <radialGradient id="spot1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#2F4632" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#2F4632" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot2" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#8B7355" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#8B7355" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="#F4ECDE"/>
  <rect width="400" height="400" fill="url(#spot1)"/>
  <rect width="400" height="400" fill="url(#spot2)"/>
  <rect width="400" height="400" filter="url(#grain)"/>
</svg>
