      text-anchor="middle"
      fill="#2F4632"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="28"
      font-weight="700"
      letter-spacing="0.42em"
    >IR</text>
    <text
      y="78"
      text-anchor="middle"
      fill="#3F5C42"
      font-family="Georgia, 'Times New Roman', serif"
